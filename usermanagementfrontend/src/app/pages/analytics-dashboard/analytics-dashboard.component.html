<div class="analytics-page">

  <div class="page-actions">
    <app-theme-toggle></app-theme-toggle>
  </div>

  <div class="analytics-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Analytics Dashboard</h1>
  </div>

  <div class="stats-grid">
    <mat-card class="stat-card">
      <h3>Total Users</h3>
      <p>126</p>
    </mat-card>

    <mat-card class="stat-card">
      <h3>Active Users</h3>
      <p>94</p>
    </mat-card>

    <mat-card class="stat-card">
      <h3>New Registrations</h3>
      <p>18</p>
    </mat-card>

    <mat-card class="stat-card">
      <h3>Reports Generated</h3>
      <p>27</p>
    </mat-card>
  </div>

  <div class="chart-grid">
    <mat-card class="chart-card">
      <h3>User Roles Distribution</h3>
      <div class="chart-placeholder pie-chart"></div>
    </mat-card>

    <mat-card class="chart-card">
      <h3>Monthly Growth</h3>
      <div class="chart-placeholder bar-chart"></div>
    </mat-card>

    <mat-card class="chart-card">
      <h3>City-wise Registrations</h3>
      <div class="chart-placeholder line-chart"></div>
    </mat-card>

    <mat-card class="chart-card">
      <h3>Stats Table</h3>
      <table class="stats-table">
        <thead>
        <tr>
          <th>Metric</th>
          <th>Value</th>
        </tr>
        </thead>
        <tbody>
        <tr><td>Male Users</td><td>68</td></tr>
        <tr><td>Female Users</td><td>52</td></tr>
        <tr><td>Other</td><td>6</td></tr>
        <tr><td>Top City</td><td>Mumbai</td></tr>
        </tbody>
      </table>
    </mat-card>
  </div>
</div>
