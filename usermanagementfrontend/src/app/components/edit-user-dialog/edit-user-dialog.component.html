<h2 mat-dialog-title>Edit User</h2>

<mat-dialog-content>

  <form [formGroup]="editForm" class="edit-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mobile</mat-label>
      <input matInput formControlName="mobile" maxlength="10">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <div class="gender-section">

      <label class="section-label">Gender</label>

      <mat-radio-group formControlName="gender">

        <mat-radio-button value="Male">Male</mat-radio-button>
        <mat-radio-button value="Female">Female</mat-radio-button>
        <mat-radio-button value="Other">Other</mat-radio-button>

      </mat-radio-group>

    </div>

    <mat-form-field appearance="outline" class="full-width">

      <mat-label>City</mat-label>

      <mat-select formControlName="city">

        <mat-option *ngFor="let city of cities" [value]="city">
          {{city}}
        </mat-option>

      </mat-select>

    </mat-form-field>

    <div class="roles-section">

      <label class="section-label">Roles Interested</label>

      <div class="roles-grid">

        <mat-checkbox
          *ngFor="let role of rolesList"
          [checked]="isRoleSelected(role)"
          (change)="onRoleChange(role, $event)"
        >
          {{role}}
        </mat-checkbox>

      </div>

    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username">
    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-stroked-button color="warn" (click)="onCancel()">
    Cancel
  </button>

  <button mat-raised-button color="primary" (click)="onSave()">
    Save
  </button>

</mat-dialog-actions>
